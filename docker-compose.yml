# English Learning platform — full assembly.
# Target: Docker on a home Mac Mini (Apple Silicon / arm64).
# db → migrate（一次性建表）→ api / worker（共用 audio volume）→ 兩個前端 nginx。

# API、文章 worker 與圖片 worker 共用的供應商／驗證環境（正式以 .env 覆寫）。
x-app-env: &app-env
  GENERATION_MODELS_FILE: /app/config/generation-models.json
  GEMINI_API_KEY: ${GEMINI_API_KEY:-dev-placeholder}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-tts}
  GEMINI_TRANSLATE_MODEL: ${GEMINI_TRANSLATE_MODEL:-gemini-2.5-flash}
  GEMINI_EXPLAIN_MODEL: ${GEMINI_EXPLAIN_MODEL:-gemini-2.5-flash}
  GEMINI_TTS_VOICE_EN: ${GEMINI_TTS_VOICE_EN:-Kore}
  GEMINI_TTS_VOICE_ZH: ${GEMINI_TTS_VOICE_ZH:-Kore}
  CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
  CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-1}
  DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@example.com}
  LOOKUP_USER_PER_MIN: ${LOOKUP_USER_PER_MIN:-10}
  LOOKUP_GLOBAL_PER_DAY: ${LOOKUP_GLOBAL_PER_DAY:-200}
  AUDIO_FORMAT: ${AUDIO_FORMAT:-m4a}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-english_learning}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-english_learning}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性執行 migration，完成即退出。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *app-env
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
      IMAGE_DIR: /data/images
      IMAGE_MODELS_FILE: /app/config/image-models.json
      IMAGE_PRICING_FILE: /app/config/image-pricing.json
      SCENARIO_STUDIO_DIR: /data/scenario-studio
      SCENARIO_QWEN_TTS_URL: ${SCENARIO_QWEN_TTS_URL:-http://host.docker.internal:8000/v1/audio/speech}
    volumes:
      - audio:/data/audio
      - images:/data/images
      - scenario-studio:/data/scenario-studio
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_STALE_MS: ${WORKER_STALE_MS:-300000}
      WORKER_BACKOFF_BASE_SEC: ${WORKER_BACKOFF_BASE_SEC:-30}
      WORKER_BACKOFF_MAX_SEC: ${WORKER_BACKOFF_MAX_SEC:-900}
    volumes:
      - audio:/data/audio
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  image-worker:
    profiles: ["images"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["npx", "tsx", "src/image-index.ts"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      IMAGE_DIR: /data/images
      IMAGE_MODELS_FILE: /app/config/image-models.json
      IMAGE_PRICING_FILE: /app/config/image-pricing.json
    volumes:
      - images:/data/images
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 情境生成採獨立 profile；啟動一般服務不會處理情境產圖／產音佇列。
  scenario-worker:
    profiles: ["scenarios"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["npx", "tsx", "src/scenario-index.ts"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
      IMAGE_DIR: /data/images
      SCENARIO_STUDIO_DIR: /data/scenario-studio
      SCENARIO_QWEN_TTS_URL: ${SCENARIO_QWEN_TTS_URL:-http://host.docker.internal:8000/v1/audio/speech}
      IMAGE_MODELS_FILE: /app/config/image-models.json
      IMAGE_PRICING_FILE: /app/config/image-pricing.json
    volumes:
      - audio:/data/audio
      - images:/data/images
      - scenario-studio:/data/scenario-studio
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web-admin:
    build:
      context: .
      dockerfile: web-admin/Dockerfile
      args:
        VITE_LEARNER_URL: ${LEARNER_URL_PUBLIC:-http://localhost:8090}
        VITE_BASE: /admin/
    ports:
      - "${WEB_ADMIN_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

  web-learner:
    build:
      context: .
      dockerfile: web-learner/Dockerfile
      args:
        VITE_ADMIN_URL: ${ADMIN_URL_PUBLIC:-http://localhost:8090/admin}
    ports:
      - "${WEB_LEARNER_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_healthy

  # 對外單一入口 reverse proxy：一個網域用路徑分流（/admin → 後台，其餘 → 前台，API 集中轉發）。
  # Cloudflare Tunnel 的 public hostname 指到 http://proxy:80。
  proxy:
    image: nginx:alpine
    volumes:
      # 掛目錄而非單檔：編輯器原子替換 nginx.conf 時，容器仍能讀到新檔案。
      - ./proxy:/etc/nginx/conf.d:ro
    ports:
      - "${PROXY_PORT:-8090}:80"
    depends_on:
      - web-admin
      - web-learner
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 對外單一入口：Cloudflare Tunnel（outbound，家裡零對外 port）。
  # ingress 路由與 Access 白名單皆在 Cloudflare Zero Trust 後台設定（Token 託管）。
  # 僅在指定 profile 時啟用：`docker compose --profile tunnel up -d`。
  # 詳見 docs/sop-cloudflare-tunnel-single-ingress-2026-07-05.md。
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # 容器未配置 IPv6 路由，固定以 IPv4 連線 Cloudflare，避免自動選址後持續連線失敗。
    command: ["tunnel", "--edge-ip-version", "4", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - proxy

  # 一次性示範資料匯入（免 LLM，從 fixtures 還原翻譯與音檔）。
  # 僅在指定 profile 時啟用：`docker compose --profile seed run --rm seed`（見 npm run seed）。
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
    volumes:
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # 僅由明確維護指令啟動；資料寫入已由本次音源統一需求授權。
  # /workspace 保留原檔／可回復封存；真正播放來源只在 audio volume。
  audio-maintenance:
    profiles: ["audio-maintenance"]
    build:
      context: .
      dockerfile: Dockerfile.audio-maintenance
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
    volumes:
      - .:/workspace
      - audio:/data/audio
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 共用 audio 未引用音檔清理；plan 只盤點，apply 才永久刪除，與產音／匯入錯開。
  audio-cleanup:
    profiles: ["audio-cleanup"]
    build:
      context: .
      dockerfile: Dockerfile.audio-cleanup
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
      AUDIO_CLEANUP_WORK_DIR: /workspace/data/audio-cleanup
    volumes:
      - .:/workspace
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # 手動執行的字庫錄音重產；預設 word，可選 kinds；plan 唯讀，--apply 才切換選定資產。
  wordbank-audio:
    profiles: ["wordbank-audio"]
    build:
      context: .
      dockerfile: Dockerfile.wordbank-audio
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-english_learning}
      AUDIO_DIR: /data/audio
      WORD_REPLACEMENT_WORK_DIR: /workspace/data/wordbank-word-replacement/qwen-lan-1.7b
    volumes:
      - .:/workspace
      - audio:/data/audio
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  audio:
  images:
  scenario-studio:
