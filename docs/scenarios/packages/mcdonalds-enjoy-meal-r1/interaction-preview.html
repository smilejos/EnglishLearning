>c.bottom)out.push(a.word);for(let j=i+1;j<items.length;j++){const b=items[j];const w=Math.min(a.r.right,b.r.right)-Math.max(a.r.left,b.r.left),h=Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top);if(w>0&&h>0)pairs.push(a.word+' × '+b.word+' ('+w.toFixed(1)+'×'+h.toFixed(1)+'px)')}}document.querySelector('#qa').textContent='可見標籤 '+items.length+'；畫布 '+c.width.toFixed(1)+'×'+c.height.toFixed(1)+' px\n標籤重疊：'+(pairs.join('；')||'無')+'\n畫布越界：'+(out.join('、')||'無')}document.querySelector('#proposal').onclick=()=>{proposal=!proposal;targets.forEach((t,i)=>{t.interaction.label={...originalLabels[i],...(proposal?(proposed[t.word]||{}):{})}});document.querySelector('#proposal').textContent=proposal?'返回套件座標':'比較調整前座標';document.querySelector('#proposal').setAttribute('aria-pressed',proposal);render()};document.querySelector('#all').onclick=()=>{['n','adj','v'].forEach(p=>shown.add(p));render()};document.querySelector('#none').onclick=()=>{shown.clear();render()};document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{shown.has(b.dataset.pos)?shown.delete(b.dataset.pos):shown.add(b.dataset.pos);render()});document.querySelector('#zoom').onclick=()=>{zoom=!zoom;document.querySelector('.scenario-image-scroll').classList.toggle('is-zoomed',zoom);document.querySelector('#zoom').textContent=zoom?'還原圖片':'放大圖片';document.querySelector('#zoom').setAttribute('aria-pressed',zoom);requestAnimationFrame(check)};document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();document.querySelector('img').onload=check;window.addEventListener('resize',check);render();</script></html>
